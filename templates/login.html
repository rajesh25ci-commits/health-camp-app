{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-3">
                        <i class="fas fa-heart-pulse fs-1"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Health Camp Portal</h3>
                    <p class="text-muted small">Sign in to access camp management & clinical records</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="e.g. admin" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="remember" name="remember">
                        <label class="form-check-label text-muted small" for="remember">
                            Remember me on this workstation
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm" style="background-color: #1e3a8a; border-color: #1e3a8a;">
                        <i class="fas fa-right-to-bracket me-2"></i> Login
                    </button>
                </form>

                <div class="mt-4 p-3 bg-light rounded-3 text-center border">
                    <span class="text-muted small d-block mb-1">Demo Credentials:</span>
                    <code class="d-block text-dark fw-bold">admin / admin123</code>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
